<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR九州 路線情報</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .buttons label {
            display: inline-block;
            padding: 12px 24px;
            background: #ffffff;
            border: 1px solid #999;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .buttons label:hover {
            background: #eeeeee;
        }

        input[type="radio"] {
            display: none;
        }

        .frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        #nippo:checked ~ .frames #frame-nippo,
        #kyudai:checked ~ .frames #frame-kyudai,
        #hohi:checked ~ .frames #frame-hohi {
            display: block;
        }

        #nippo:checked ~ .buttons label[for="nippo"],
        #kyudai:checked ~ .buttons label[for="kyudai"],
        #hohi:checked ~ .buttons label[for="hohi"] {
            background: #333333;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <input type="radio" name="line" id="nippo">
    <input type="radio" name="line" id="kyudai">
    <input type="radio" name="line" id="hohi">

    <div class="buttons">
        <label for="nippo">日豊本線</label>
        <label for="kyudai">久大本線</label>
        <label for="hohi">豊肥本線</label>
    </div>

    <div class="frames">
        <iframe
            id="frame-nippo"
            class="frame"
            src="https://george-doredore.jrkyushu.co.jp/jrqSEN10.html#EKINO1039">
        </iframe>

        <iframe
            id="frame-kyudai"
            class="frame"
            src="https://george-doredore.jrkyushu.co.jp/jrqSEN55.html#EKINO1333">
        </iframe>

        <iframe
            id="frame-hohi"
            class="frame"
            src="https://george-doredore.jrkyushu.co.jp/jrqSEN17.html#EKINO1733">
        </iframe>
    </div>

</body>
</html>
